[[env.production.durable_objects.bindings]]
name = "ACCOUNT"
class_name = "AccountDO"
[[env.production.durable_objects.bindings]]
name = "BASE"
class_name = "BaseDO"
[[env.production.durable_objects.bindings]]
name = "DIRECTORY"
class_name = "DirectoryDO"
[[env.production.durable_objects.bindings]]
name = "INVITES"
class_name = "InvitesDO"
[[env.production.durable_objects.bindings]]
name = "GATEWAY"
class_name = "GatewayDO"
[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["AccountDO", "BaseDO", "DirectoryDO", "InvitesDO"]
[[env.production.migrations]]
tag = "v2"
new_sqlite_classes = ["GatewayDO"]
[[env.production.r2_buckets]]
