[package]
name = "bh-authz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Local-only attestation: a labelled synthetic quote the matching synthetic
# client appraisal accepts. Never enabled in a release build.
synthetic-attestation = [
  "bh-confidential-attestation/synthetic-attestation",
  "bh-confidential-channel/synthetic-attestation",
]

[dependencies]
bh-account.workspace = true
bh-authz-proto = { path = "../../libs/authz-proto" }
bh-confidential-attestation.workspace = true
bh-confidential-channel.workspace = true
bh-confidential-host = { path = "../confidential-host" }
bh-confidential-policy.workspace = true
bh-crypto.workspace = true
bh-event.workspace = true
bh-qualified-time = { path = "../../libs/qualified-time" }
bh-sync.workspace = true
bh-tls-roots.workspace = true
futures-util.workspace = true
hex.workspace = true
rusqlite.workspace = true
serde_json.workspace = true # local channel example shares the device-side test helper
rustls.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true

[dev-dependencies]
bh-authz-test-alloc = { path = "tests/alloc-count" }
# The native device that makes base controls in the tests.
bh-core.workspace = true
bh-device.workspace = true
# Paused time for the connection deadlines.
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true

[[example]]
name = "sync-release-validator"
path = "../../scripts/sync_release_validator.rs"

[[example]]
name = "local_keys"
required-features = ["synthetic-attestation"]

[[example]]
name = "local_probe"
required-features = ["synthetic-attestation"]

[[example]]
name = "forged_account_change"
required-features = ["synthetic-attestation"]

[lints]
workspace = true
