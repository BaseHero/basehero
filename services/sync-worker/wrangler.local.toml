# Local Miniflare/workerd configuration only. It names no account, route or
# deploy target. The local run supplies HOSTING_ROOT (hex) and the generated
# local receipt key RECEIPT_KEY (hex seed) and RECEIPT_CERT (hex certificate)
# as secrets; none is ever written here.
name = "bh-sync-local"
main = "src/edge.mjs"
compatibility_date = "2026-07-01"
workers_dev = false

[vars]
# Authorization backends as a JSON list of {url, ready}; one ready backend is
# chosen per /v1/authz connection.
AUTHZ_BACKENDS = '[{"url":"http://127.0.0.1:7801/v1/channel","ready":true}]'

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]

[[durable_objects.bindings]]
name = "LOG"
class_name = "LogObject"

[[durable_objects.bindings]]
name = "RELAY"
class_name = "PairingRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LogObject", "PairingRelay"]

[[r2_buckets]]
binding = "BODIES"
bucket_name = "bh-bodies-local"
