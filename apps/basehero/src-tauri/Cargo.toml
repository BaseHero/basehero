[package]
name = "basehero-app"
version.workspace = true
edition.workspace = true

[lib]
name = "basehero_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2.12", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding.workspace = true
ts-rs.workspace = true
bh-core = { path = "../../../crates/bh-core" }
tokio.workspace = true
futures-util.workspace = true
bh-models = { path = "../../../crates/bh-models" }
getrandom.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
bh-mac-keychain-helper = { path = "../../../crates/bh-mac-keychain-helper" }
sha2 = "0.10"

# reqwest's rustls verifies through Android's trust store, which needs the app's context.
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22", default-features = false }
ndk-context = "0.1.1"
rustls-platform-verifier = "0.7.1"

[dev-dependencies]
tempfile = "3"
bh-testkit = { path = "../../../crates/bh-testkit" }
yrs = "0.28"
