[package]
name = "bh-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "bh_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Real-app WebDriver tests only; never part of a release build.
webdriver = ["dep:tauri-plugin-webdriver"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri.workspace = true
tauri-plugin-webdriver = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
bh-account.workspace = true
bh-mac-local-auth.workspace = true
security-framework.workspace = true

[lints]
workspace = true
