[package]
name = "bh-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "bh_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Real-app WebDriver tests only; never part of a release build.
webdriver = ["dep:tauri-plugin-webdriver"]

[build-dependencies]
tauri-build.workspace = true
serde_json.workspace = true

[dependencies]
tauri.workspace = true
bh-device.workspace = true
bh-storage.workspace = true
bh-provider-policy-store.workspace = true
basehero-models = { path = "../../../libs/models", features = ["near-route"] }
bh-confidential-attestation.workspace = true
bh-account.workspace = true
serde.workspace = true
serde_json.workspace = true
zxcvbn.workspace = true
tokio.workspace = true
tauri-plugin-webdriver = { workspace = true, optional = true }

[dev-dependencies]
rusqlite.workspace = true
tempfile.workspace = true
bh-release.workspace = true
bh-crypto.workspace = true
flate2.workspace = true
tar.workspace = true
plist.workspace = true
url.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
bh-device-keys.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
bh-mac-keychain-helper.workspace = true
bh-mac-local-auth.workspace = true
bh-release.workspace = true
bh-crypto.workspace = true
plist.workspace = true
url.workspace = true
bh-mac-lifecycle.workspace = true
security-framework.workspace = true
rfd.workspace = true

[lints]
workspace = true
