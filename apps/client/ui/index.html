<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>BaseHero</title>
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="signup.css">
  <link rel="stylesheet" href="pairing.css">
  <link rel="stylesheet" href="devices.css">
  <link rel="stylesheet" href="note-editor.css">
  <script src="theme.js" defer></script>
  <script src="update.js" defer></script>
  <script src="about.js" type="module"></script>
  <script src="note-bridge.js" type="module"></script>
</head>
<body>
  <!-- The location bar is also the window's title bar: drag it to move the window. -->
  <header class="bar" data-tauri-drag-region="deep">
    <button type="button" id="sidebar-toggle" class="ib" aria-label="Show or hide notes" title="Show or hide notes (⌃⌘S)" aria-controls="notes-side" aria-expanded="true" hidden>
      <svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 2.5h13v11h-13z"/><path d="M6 2.5v11"/></svg>
    </button>
    <span class="trail"><span class="crumb">BaseHero</span><svg class="i arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h9M8.5 4.5L12 8l-3.5 3.5"/></svg><strong class="here">SETUP</strong></span>
    <span class="spacer"></span>
    <button type="button" id="update-chip"><span class="sq" aria-hidden="true"></span><span>Update</span></button>
  </header>
  <section id="update-banner" aria-live="polite" hidden>
    <p id="update-message"></p>
    <progress id="update-progress" aria-label="Downloading update" hidden></progress>
    <p id="update-notes" hidden></p>
    <div id="update-actions">
      <button type="button" id="update-notes-toggle">What’s new</button>
      <button type="button" id="update-install">Install update</button>
      <button type="button" id="update-not-now">Not now</button>
    </div>
    <button type="button" id="update-dismiss" hidden>Dismiss</button>
  </section>
  <main>
    <p class="label">BASEHERO</p>
    <h1>Open your notes in BaseHero.</h1>
    <p>Start the BaseHero app to create an account or open your notes.</p>
  </main>
  <footer>NO ACCOUNT OPEN · NOT CONNECTED</footer>
</body>
</html>
