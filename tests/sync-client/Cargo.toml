[package]
name = "bh-sync-client-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Opt in only for local integration tests; no normal/build release edge enables it.
synthetic-attestation = ["bh-authz/synthetic-attestation", "bh-sync-client/synthetic-attestation"]
# Stress and sweep qualification rows, opt in with `bash scripts/check.sh
# qualification-stress`; the gated 100 ms rows run in `check.sh portable`.
qualification-stress = ["synthetic-attestation"]

[dev-dependencies]
bh-account.workspace = true
bh-authz = { path = "../../services/authz" }
bh-confidential-attestation.workspace = true
bh-confidential-policy.workspace = true
bh-core.workspace = true
bh-crypto.workspace = true
bh-data = { workspace = true, features = ["testkit"] }
bh-device.workspace = true
bh-event.workspace = true
bh-storage.workspace = true
bh-sync.workspace = true
bh-sync-client = { path = "../../libs/sync-client", features = ["test-support"] }
futures-util.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true
yrs.workspace = true

[lints]
workspace = true
