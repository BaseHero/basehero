[package]
name = "bh-host-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Opt in only for local integration tests; no normal/build release edge enables it.
synthetic-attestation = ["bh-authz/synthetic-attestation", "bh-sync-client/synthetic-attestation", "bh-host/synthetic-attestation"]

[dev-dependencies]
bh-account.workspace = true
bh-authz = { path = "../../services/authz" }
bh-confidential-attestation.workspace = true
bh-confidential-policy.workspace = true
bh-crypto.workspace = true
bh-device.workspace = true
bh-host = { workspace = true, features = ["test-support"] }
bh-storage.workspace = true
bh-sync.workspace = true
bh-sync-client = { workspace = true, features = ["test-support"] }
futures-util.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true

[lints]
workspace = true
