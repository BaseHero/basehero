[package]
name = "bh-mac-keychain-helper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The app links only the protocol library; the helper binary owns Keychain I/O.
# Every dependency here is part of the helper's bytes, so keep the list short.
[[bin]]
name = "bh-keychain-helper"
path = "src/main.rs"

[dependencies]
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
security-framework.workspace = true

# Mach audit-token calls are unavoidable FFI; the rest of the workspace forbids unsafe.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
