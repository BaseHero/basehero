[package]
name = "bh-note-engine-artifact"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
wasmtime = { workspace = true, features = ["runtime", "std", "pulley", "anyhow"] }

# Only the build compiles Wasm; apps load its output.
[build-dependencies]
wasmtime = { workspace = true, features = ["cranelift", "std", "pulley", "anyhow"] }

# Loading the precompiled module is one documented unsafe call.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
