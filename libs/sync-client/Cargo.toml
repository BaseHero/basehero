[package]
name = "bh-sync-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Local-only appraisal of the labelled synthetic attestation a local
# authorization service presents. Never enabled in a release build.
synthetic-attestation = ["bh-confidential-channel/synthetic-attestation"]
# Tests may choose another pacing or a commit time (`Client::start_tuned`).
# Never enabled in a release build.
test-support = []

[dependencies]
# The QR text form: base64url without padding.
base64.workspace = true
bh-account.workspace = true
bh-authz-proto.workspace = true
bh-confidential-channel.workspace = true
bh-confidential-policy.workspace = true
bh-crypto.workspace = true
bh-device.workspace = true
bh-event.workspace = true
bh-storage.workspace = true
bh-sync.workspace = true
bh-tls-roots.workspace = true
futures-util.workspace = true
# The edge's pairing relay is plain HTTPS POST/GET, not a socket route.
reqwest.workspace = true
rustls.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
yrs.workspace = true

[dev-dependencies]
bh-confidential-attestation.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
