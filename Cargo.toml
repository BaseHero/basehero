[workspace]
members = ["crates/*", "apps/basehero/src-tauri"]
resolver = "2"

# Fixed for the byte-stable Mac Keychain helper, independent of app release changes.
[profile.keychain-helper]
inherits = "release"
opt-level = 3
debug = false
split-debuginfo = "off"
strip = true
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
rpath = false

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
base64 = "0.22"
percent-encoding = "2"
getrandom = "0.3"
futures-util = "=0.3.34"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "=0.23.45", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std", "tls12"] }
webpki-roots = "=1.0.9"
tinfoil = { git = "https://github.com/tinfoilsh/tinfoil-rs", rev = "91e8aef8fbc34129b68de8667ece5bd9ef7b7110" }
tinfoil-ehbp = { git = "https://github.com/tinfoilsh/encrypted-http-body-protocol", rev = "93cc1fa1ad61e19f9a34fb23cb5b5d5635d3edb0", default-features = false, features = ["rustls-no-provider"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
url = "=2.5.8"
zeroize = "1"
hpke = { version = "=0.13.0", default-features = false, features = ["alloc", "x25519"] }
aes-gcm = "=0.10.3"
rand = { version = "=0.9.5", default-features = false, features = ["os_rng", "std_rng"] }
hex = "=0.4.3"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
zxcvbn = { version = "=3.1.1", default-features = false }
